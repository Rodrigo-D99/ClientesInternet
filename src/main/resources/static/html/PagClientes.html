<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .table-container { max-height: 600px; overflow-y: auto; }
        #fileName { cursor: default; }
    </style>
</head>
<body>

<div class="container">

    <h1 class="mb-4">Clientes</h1>

    <!-- Filtros y botones -->
    <div class="row mb-3 g-2">
        <div class="col-md-3">
            <input type="text" id="filterName" class="form-control" placeholder="Filtrar por nombre">
        </div>
        <div class="col-md-3">
            <select id="filterDeudores" class="form-select">
                <option value="">Todos</option>
                <option value="true">Solo deudores</option>
                <option value="false">Solo al día</option>
            </select>

        </div>
        <div class="col-md-6 d-flex align-items-center">
            <button class="btn btn-primary me-2" onclick="nuevoCliente()">
                Agregar cliente
            </button>
            <input type="file" id="inputExcel" accept=".xlsx" style="display:none;">
            <button id="btnImport" class="btn btn-primary me-2">Importar Excel</button>
            <button id="btnExport" class="btn btn-success">Exportar Excel</button>
        </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="table-container">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Meses adeudados</th>
                <th>Medio de pago</th>
                <th>DNI</th>
                <th>Monto / Nota</th>
                <th>Último pago</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="clientesTableBody">
            <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>

    <!-- Paginación -->
    <nav>
        <ul class="pagination" id="pagination"></ul>
    </nav>

</div>














<div class="modal fade" id="clienteModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloForm">Nuevo cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="formCliente">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input id="nombre" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input id="telefono" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Dirección</label>
                            <input id="direccion" class="form-control">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Meses adeudados</label>
                            <input id="mesesAdeudados" type="number" min="0" class="form-control">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Medio de pago</label>
                            <select id="medioPago" class="form-select">
                                <option value="">Seleccione</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                                <option value="TARJETA">Tarjeta</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Monto</label>
                            <input type="number" step="0.01" min="0"
                                   id="monto" class="form-control" placeholder="Ej: 5000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI</label>
                            <input id="dni" class="form-control">
                            <small id="dniWarning" class="text-warning d-none">
                                ⚠️ Para transferencias o tarjetas se recomienda cargar DNI
                            </small>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Nota</label>
                            <textarea id="nota" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="submit"
                        form="formCliente"
                        class="btn btn-primary">
                    Guardar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio -->
<script src="../js/AppClientes.js" defer></script>

</body>
</html>
